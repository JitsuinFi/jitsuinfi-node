name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZCASH_DEVTOOL_REV: b532d4cd760d30213c961fe0638ee6b6e1bf8e30

jobs:
  check:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # read-only deploy key of the private jitsuinfi-zcash repo (the jitsuin crates)
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ZCASH_DEPLOY_KEY }}
      - run: git config --global url."git@github.com:JitsuinFi/jitsuinfi-zcash".insteadOf "https://github.com/JitsuinFi/jitsuinfi-zcash"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  deploy:
    name: build binaries and deploy to Railway
    needs: [check, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Build and upload only; a paused Railway fails the job fast and "retry deploy" re-runs it
    # later (minutes are billed while a job waits). A newer main cancels an older deploy.
    timeout-minutes: 30
    concurrency:
      group: railway-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ZCASH_DEPLOY_KEY }}
      - run: git config --global url."git@github.com:JitsuinFi/jitsuinfi-zcash".insteadOf "https://github.com/JitsuinFi/jitsuinfi-zcash"
      - uses: Swatinem/rust-cache@v2
      - name: zcash-devtool (cached by revision)
        id: devtool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/zcash-devtool
          key: zcash-devtool-${{ runner.os }}-${{ env.ZCASH_DEVTOOL_REV }}
      - if: steps.devtool.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/zcash/zcash-devtool --rev "$ZCASH_DEVTOOL_REV" zcash-devtool
      - run: cargo build --release --locked
      - name: runtime context
        run: |
          mkdir -p deploy/bin
          cp target/release/jitsuin-node ~/.cargo/bin/zcash-devtool deploy/bin/
      # The archive is deploy/ only (Dockerfile + binaries); deploy/bin is git-ignored, so keep it.
      - name: railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: .github/railway-up.sh financier-node
      # The judges' demo console (HNK-26.T26): the same binaries, DEMO=1 on that service.
      - name: railway up (demo)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: .github/railway-up.sh financier-node-demo
