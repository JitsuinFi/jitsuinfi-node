<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="The deal route: sent to the buyer, buyer signs, public record, financing letter sealed, advance, settled">
  <style>
    .serif{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif}
    .sans{font-family:Geist,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    @keyframes lit{0%{fill:#FCFCFE}5%,92%{fill:#7E2A53}100%{fill:#FCFCFE}}
    @keyframes txt{0%{fill:#7E2A53}5%,92%{fill:#FCFCFE}100%{fill:#7E2A53}}
    @keyframes line{0%{stroke-dashoffset:130}6%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:130}}
    circle{fill:#FCFCFE;animation:lit 9s infinite backwards}
    .serif{fill:#7E2A53;animation:txt 9s infinite backwards}
    .l{stroke-dasharray:130;stroke-dashoffset:130;animation:line 9s infinite backwards}
  </style>
  <rect width="1200" height="170" rx="18" fill="#FCFCFE" stroke="#ECD0EC"/>
  <g stroke="#BA71A2" stroke-width="3" fill="none"><path class="l" style="animation-delay:0.9s" d="M144 62H272"/><path class="l" style="animation-delay:2.1s" d="M340 62H468"/><path class="l" style="animation-delay:3.3s" d="M536 62H664"/><path class="l" style="animation-delay:4.5s" d="M732 62H860"/><path class="l" style="animation-delay:5.7s" d="M928 62H1056"/></g>
  <circle cx="110" cy="62" r="32" stroke="#7E2A53" stroke-width="3" style="animation-delay:0.3s"/><text x="110" y="74" text-anchor="middle" class="serif" font-size="32" font-weight="800" style="animation-delay:0.3s">照</text><circle cx="306" cy="62" r="32" stroke="#7E2A53" stroke-width="3" style="animation-delay:1.5s"/><text x="306" y="74" text-anchor="middle" class="serif" font-size="32" font-weight="800" style="animation-delay:1.5s">署</text><circle cx="502" cy="62" r="32" stroke="#7E2A53" stroke-width="3" style="animation-delay:2.7s"/><text x="502" y="74" text-anchor="middle" class="serif" font-size="32" font-weight="800" style="animation-delay:2.7s">登</text><circle cx="698" cy="62" r="32" stroke="#7E2A53" stroke-width="3" style="animation-delay:3.9s"/><text x="698" y="74" text-anchor="middle" class="serif" font-size="32" font-weight="800" style="animation-delay:3.9s">印</text><circle cx="894" cy="62" r="32" stroke="#7E2A53" stroke-width="3" style="animation-delay:5.1s"/><text x="894" y="74" text-anchor="middle" class="serif" font-size="32" font-weight="800" style="animation-delay:5.1s">金</text><circle cx="1090" cy="62" r="32" stroke="#7E2A53" stroke-width="3" style="animation-delay:6.3s"/><text x="1090" y="74" text-anchor="middle" class="serif" font-size="32" font-weight="800" style="animation-delay:6.3s">済</text>
  <g class="sans" font-size="15" fill="#020D2F" text-anchor="middle"><text x="110" y="124">sent to the buyer</text><text x="110" y="146" fill="#502A50">supplier</text><text x="306" y="124">buyer signs</text><text x="306" y="146" fill="#502A50">buyer · passkey</text><text x="502" y="124">public record</text><text x="502" y="146" fill="#502A50">financier's node</text><text x="698" y="124">financing letter sealed</text><text x="698" y="146" fill="#502A50">supplier · buyer</text><text x="894" y="124">advance + seal</text><text x="894" y="146" fill="#502A50">financier · passkey</text><text x="1090" y="124">repaid, settled</text><text x="1090" y="146" fill="#502A50">buyer → financier</text></g>
</svg>
