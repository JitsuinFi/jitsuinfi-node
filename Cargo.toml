[package]
name = "jitsuin-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "JitsuinFi financier node: wallet, deal state, relay mailbox and console (HNK-26)"

[dependencies]
# Pinned to a reviewed commit of jitsuinfi-zcash (main after PR #20).
jitsuin-core = { git = "https://github.com/JitsuinFi/jitsuinfi-zcash", rev = "3063f18c089f617e221ac22c4eb7ee61507439e1" }
jitsuin-flow = { git = "https://github.com/JitsuinFi/jitsuinfi-zcash", rev = "3063f18c089f617e221ac22c4eb7ee61507439e1" }
jitsuin-board = { git = "https://github.com/JitsuinFi/jitsuinfi-zcash", rev = "3063f18c089f617e221ac22c4eb7ee61507439e1" }
jitsuin-wallet = { git = "https://github.com/JitsuinFi/jitsuinfi-zcash", rev = "3063f18c089f617e221ac22c4eb7ee61507439e1" }
# Same pins as the jitsuinfi-zcash workspace (D-10).
blake2b_simd = "=1.0.5"
ed25519-dalek = "2.2"
# Approved by the user 2026-10-20: HTTP server and console (behind Railway's HTTPS edge).
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["set-header"] }
rand = "0.9"
# Approved by the user 2026-10-20: HTTPS client to the relay (rustls, no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
# Approved by the user 2026-10-20: console passkeys (pairing HNK-26.T2, sessions HNK-26.T3).
webauthn-rs = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
